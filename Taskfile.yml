version: '3'

dotenv:
  - '.env'

vars:
  SITE: '{{.SITE | default "hansard"}}'
  SITE_TO_IDENTITY:
    map:
      hansard: '{{ env "SITE_IDENTITY_HANSARD" | default (env "SITE_IDENTITY") }}'
  SITE_TO_USER:
    map:
      hansard: '{{ env "SITE_USER_HANSARD" | default (env "SITE_USER") }}'
  SITE_TO_HOST:
    map:
      hansard: '{{ env "SITE_HOST_HANSARD" | default (env "SITE_HOST") }}'

tasks:
  __validate_site:
    internal: true
    requires:
      vars:
        - name: SITE
          enum: [hansard]

  summarise:
    deps:
      - __validate_site
    requires:
      vars: [START_DATE, END_DATE]
    preconditions:
      - sh: |
          echo "{{.START_DATE}}" | grep -Eq '^(19|20)[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        msg: 'START_DATE must be YYYY-MM-DD (e.g. 2026-01-31)'
      - sh: |
          echo "{{.END_DATE}}" | grep -Eq '^(19|20)[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        msg: 'END_DATE must be YYYY-MM-DD (e.g. 2026-01-31)'
    cmds:
      - './scripts/summarise_{{.SITE}}.sh {{.START_DATE}} {{.END_DATE}}'

  build:
    deps:
      - __validate_site
    cmds:
      - hugo build -s sites/{{.SITE}} --gc

  publish-atproto:
    deps:
      - __validate_site
    dir: sites/{{.SITE}}
    preconditions:
      - sh: command -v sequoia
        msg: |-
          The `sequoia` CLI is required to publish this site to the AT Protocol, but it isn't installed.
          Install it with `npm i -g sequoia-cli`, then authenticate with `sequoia login`.
          See https://sequoia.pub/quickstart for details.
    cmds:
      - sequoia sync --update-frontmatter
      - sequoia publish

  inject-atproto:
    deps:
      - __validate_site
    dir: sites/{{.SITE}}
    preconditions:
      - sh: command -v sequoia
        msg: |-
          The `sequoia` CLI is required to publish this site to the AT Protocol, but it isn't installed.
          Install it with `npm i -g sequoia-cli`, then authenticate with `sequoia login`.
          See https://sequoia.pub/quickstart for details.
    cmds:
      - sequoia inject

  deploy-site:
    deps:
      - __validate_site
    vars:
      HOST: '{{index .SITE_TO_HOST .SITE}}'
      IDENTITY: '{{index .SITE_TO_IDENTITY .SITE}}'
      USER: '{{index .SITE_TO_USER .SITE}}'
    cmds:
      - rsync -aIP -e "ssh -i {{.IDENTITY}}" sites/{{.SITE}}/public/ {{.USER}}@{{.HOST}}:.

  deploy:
    deps:
      - __validate_site
    cmds:
      - task: publish-atproto
      - task: build
      - task: inject-atproto
      - task: deploy-site

  serve:
    deps:
      - __validate_site
    cmds:
      - hugo serve -s sites/{{.SITE}} --gc
